name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SiliPuTTY.csproj -c Release
      - name: Test
        run: dotnet run --project tests/SiliPuTTY.Tests/SiliPuTTY.Tests.csproj -c Release
      - name: Publish portable build
        run: dotnet publish SiliPuTTY.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/SiliPuTTY-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SiliPuTTY-win-x64
          path: artifacts/SiliPuTTY-win-x64/
