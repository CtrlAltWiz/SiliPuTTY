name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          [xml]$project = Get-Content SiliPuTTY.csproj
          $projectVersion = $project.Project.PropertyGroup.Version
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

      - name: Build
        run: dotnet build SiliPuTTY.csproj -c Release

      - name: Test
        run: dotnet run --project tests/SiliPuTTY.Tests/SiliPuTTY.Tests.csproj -c Release

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish SiliPuTTY.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/SiliPuTTY-win-x64
          Compress-Archive -Path artifacts/SiliPuTTY-win-x64/* -DestinationPath "artifacts/SiliPuTTY-$version-win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" "installer\SiliPuTTY.iss"

      - name: Smoke test installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installer = Resolve-Path "artifacts\SiliPuTTY-$version-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "SiliPuTTY-smoke"
          $install = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $app = Join-Path $installDir "SiliPuTTY.exe"
          if (!(Test-Path $app)) { throw "Installed executable was not found." }
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Installed application exited during launch smoke test with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller was not found." }
          $uninstall = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }

      - name: Create checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $files = @(
            "artifacts/SiliPuTTY-$version-win-x64.zip",
            "artifacts/SiliPuTTY-$version-Setup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "artifacts/SHA256SUMS.txt"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $releaseArgs = @(
            "release", "create", "${{ github.ref_name }}",
            "artifacts/SiliPuTTY-$version-win-x64.zip",
            "artifacts/SiliPuTTY-$version-Setup.exe",
            "artifacts/SHA256SUMS.txt",
            "--title", "SiliPuTTY $version",
            "--generate-notes",
            "--verify-tag"
          )
          if ($version -match '(?i)(alpha|beta|rc)') {
            $releaseArgs += "--prerelease"
          }
          gh @releaseArgs
